<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript + DOM</title>
</head>
<body>

    <h1>DOM (DOCUMENTO OBJECT MODEL)</h1>

    <script>
        console.log('Hola DOM')
        console.log(document)
        console.log({document})
        console.log({ document: document })

        console.log(document.title) //leemos el titulo de la pagina

        document.title = "Mi nueva página"
    </script>
    
</body>
</html>
